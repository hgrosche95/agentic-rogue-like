[project]
name = "agentic-rogue-like"
version = "0.1.0"
description = "A roguelike where an LLM agent generates run content (enemies, relics, events) inside balance-constrained tool schemas instead of fixed drop tables."
readme = "README.md"
authors = [
    { name = "hgrosche95", email = "h.grosche95@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
agentic-rogue-like = "agentic_rogue_like:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "UP", "B"]
