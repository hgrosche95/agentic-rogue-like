name: CI

# Runs on every PR and on pushes to branches other than master, and is called
# by deploy.yml as its first job - so nothing reaches Azure without passing
# the same checks a contributor runs locally.
on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # src and tests only: tools/trailer/ holds one-off render scripts that
      # were never held to the lint rules and don't ship.
      - name: Lint
        run: uv run ruff check src tests

      # No GROQ_API_KEY and no ENCOUNTER_AGENT_ENABLED here on purpose: the
      # suite is network-free and must stay that way.
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc -b && vite build - catches type errors as well as bundling ones.
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
